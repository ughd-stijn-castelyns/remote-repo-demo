name: Deploy
on:
  workflow_call:
    inputs:
      artifact-name:
        type: string
        default: webapp
      environment:
        type: string
        default: production
      run-id:
        type: string
        default: ''
        description: Run to pull the artifact from. Empty = this run.
  workflow_dispatch:
    inputs:
      artifact-name:
        type: string
        default: webapp
      environment:
        type: choice
        options: [staging, production]
        default: staging
      run-id:
        type: string
        description: CI run ID to deploy. Leave blank to use the latest build.

jobs:
    deploy:
        name: Deploy to staging
        runs-on: self-hosted
        permissions:
            id-token: write
            contents: read
            actions: read
        environment:
            name: ${{ inputs.environment }}
            url: ${{ steps.deploy.outputs.webapp-url }}
        steps:
        - name: Download build output
          uses: actions/download-artifact@v7
          with:
            name: ${{ inputs.artifact-name }}
            path: ./publish
            # Omitting run-id means "this run"; the fallback covers both callers.
            run-id: ${{ inputs.run-id || github.run_id }}
            github-token: ${{ secrets.GITHUB_TOKEN }}
        - name: Azure Login
          uses: azure/login@v2
          with:
            creds: ${{ secrets.AZURE_CREDENTIALS }}
        - name: Deploy to Azure
          id: deploy
          uses: azure/webapps-deploy@v3
          with:
            app-name: mybasicwebapp
            package: ./publish
        - name: Logout
          if: always()
          run: az logout
